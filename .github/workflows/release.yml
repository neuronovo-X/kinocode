name: release
# КиноКод для Windows: тег v* собирает установщик (без подписи кода, Windows покажет SmartScreen) и выкладывает
# kinocode-Setup-x64.exe в GitHub Releases под этим тегом.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # the pnpm version package.json names (packageManager): 9
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=22.18.0 <23'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ffmpeg and chromium-headless-shell are fetched by the build itself into resources/runtime
      - run: pnpm --filter @openfilm/desktop release --platform=win --arch=x64
      - uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/.release/win-x64/out/kinocode-Setup-x64.exe
          fail_on_unmatched_files: true
