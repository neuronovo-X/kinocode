name: Ошибка
description: Что-то в КиноКоде работает не так, как должно.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Версия КиноКода
      description: Настройки → О программе, или что выводит `kinocode --version`.
      placeholder: 0.2.4
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Система
      placeholder: Windows 11, macOS 15.5, Ubuntu 24.04…
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Агент
      description: Какой агент работал с КиноКодом, если был.
      options:
        - Без агента (Studio или команда вручную)
        - Claude Code
        - Codex
        - Cursor
        - Другой (напишите ниже)
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Диагностический отчёт
      description: |
        В Studio: Настройки → Для разработчиков → Скопировать отчёт (в приложении — «Скопировать диагностический отчёт»
        под сообщением, на котором случилась ошибка), и вставьте сюда. Без Studio — вывод `kinocode doctor`. Пути в
        домашней папке показаны как ~, ключей и аккаунтов там нет. Если ничего не запускается, так и напишите.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      placeholder: |
        1. kinocode open demo
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло
      description: Вывод команды или текст ошибки.
    validations:
      required: true
  - type: textarea
    id: film
    attributes:
      label: Фильм или логи
      description: |
        Если можете, приложите папку фильма (архивом, без тяжёлых медиа) или минимальный film.html с ошибкой и лог
        Studio (~/.kinocode/logs/studio.log). Не прикладывайте ничего личного, например ключи.
