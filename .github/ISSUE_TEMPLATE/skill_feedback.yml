name: Отзыв о скилле
description: Как сработал скилл или какого скилла не хватает.
labels: [skills]
body:
  - type: input
    id: skill
    attributes:
      label: Скилл
      description: Название или ссылка, если добавляли по ссылке. Оставьте пустым, если такого скилла пока нет.
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Что вы просили, что агент сделал со скиллом и чего вы ждали.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Агент
      description: Какой агент и модель, если знаете.
